name: Chadteleport
version: 0.6.3
main: basementhost.randomchad.ChadteleportPlugin
api-version: '26.1.2'
description: Teleportation Plugin with few tweak
author: Random_Chad

softdepend:
  - Vault
  - ChadCore

permissions:
  chadteleport.admin:
    description: Allows use of /chadteleport reload
    default: op

  chadteleport.admin.tp:
    description: Allows teleporting yourself or another player with /tp
    default: op

  chadteleport.admin.tppos:
    description: Allows teleporting to coordinates with /tppos
    default: op

  chadteleport.admin.overheat.check:
    description: Allows inspecting another player's teleport heat
    default: op

  chadteleport.admin.overheat.reset:
    description: Allows resetting a player's teleport heat
    default: op

  chadteleport.setspawn:
    description: Allows setting the server spawn
    default: op

  chadteleport.bypass.*:
    description: Bypass teleport fees and warmup
    default: op
    children:
      chadteleport.bypass.fee: true
      chadteleport.bypass.warmup: true

  chadteleport.bypass.fee:
    description: Bypass teleport fee
    default: op

  chadteleport.bypass.warmup:
    description: Bypass teleport warmup
    default: op

  chadteleport.bypass.overheat:
    description: Bypass the teleport heat threshold and heat gain
    default: false

  chadteleport.spawn:
    description: Allows using /spawn
    default: true

  chadteleport.home.*:
    description: Allows unlimited homes
    default: op

  chadteleport.home.1:
    description: Allows 1 home
    default: false

  chadteleport.home.3:
    description: Allows 3 homes
    default: false
