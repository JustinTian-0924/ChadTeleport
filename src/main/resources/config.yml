language:
  default-locale: en_us

# Each command independently selects 'free', 'fixed', or 'distance' pricing.
# fixed-price is used only in fixed mode. base-price, distance-price-1k, and world-overrides apply only to distance mode.
# The final total is rounded to two decimal places. Fee bypass permissions make the quoted price 0.
features:
  spawn:
    enable: true
    require-permission: false
    permission: chadteleport.spawn
    pricing:
      mode: free
      fixed-price: 0.0
      base-price: 10.0
      distance-price-1k: 10.0
      include-world-transfer-fees: true
    warmup: true
    use-tpa-warmup: true
    fixed-warmup-seconds: 0.0
  warp:
    enable: true
    pricing:
      mode: distance
      fixed-price: 10.0
      base-price: 10.0
      distance-price-1k: 10.0
      include-world-transfer-fees: true
    warmup: true
    use-tpa-warmup: true
    fixed-warmup-seconds: 0.0
  home:
    enable: true
    pricing:
      mode: fixed
      fixed-price: 10.0
      base-price: 10.0
      distance-price-1k: 10.0
      include-world-transfer-fees: true
    warmup: true
    timing:
      use-custom-formula: false
      base-time: 3.0
      distance-time-1k: 1.0
  tpa:
    enable: true
    pricing:
      mode: distance
      fixed-price: 10.0
      base-price: 10.0
      distance-price-1k: 10.0
      include-world-transfer-fees: true
      # Use full world keys. For custom worlds, enter the actual key used by the server.
      world-overrides:
        "minecraft:resources":
          base-price: 0.0
          distance-price-1k: 5.0
        "minecraft:the_nether":
          base-price: 20.0
          distance-price-1k: 15.0
        "minecraft:the_end":
          base-price: 30.0
          distance-price-1k: 20.0
    warmup: true

# Pricing groups use permission nodes granted by your permissions plugin.
# Rules are resolved separately for each command. Highest priority wins; ties use group IDs in alphabetical order.
# Only matching groups that define the command participate. Otherwise the command's normal pricing is used.
# Each command entry is a complete pricing rule, not a percentage discount or a partial override.
# Group world-overrides belong to that group rule and do not inherit the normal command's world-overrides.
# New permission nodes are registered as default: false. Grant them explicitly to the intended groups or players.
# Set pricing-groups: {} to disable group pricing.
pricing-groups:
  vip:
    permission: chadteleport.pricing.vip
    priority: 100
    commands:
      tpa:
        mode: distance
        base-price: 5.0
        distance-price-1k: 5.0
        include-world-transfer-fees: true
      home:
        mode: fixed
        fixed-price: 5.0
  vip_plus:
    permission: chadteleport.pricing.vip_plus
    priority: 200
    commands:
      tpa:
        mode: free
      home:
        mode: fixed
        fixed-price: 2.0
      warp:
        mode: fixed
        fixed-price: 3.0

# On first use, each player receives starting-points once. Points are used before coins.
# Points are whole units. If the final point covers more than the remaining fee, no change is given.
# Existing balances are kept when the starting amount changes.
teleport-balance:
  enabled: true
  starting-points: 30
  coins-per-point: 1.0
  display-name: Teleport Points
  # The cap limits recovery and the starting grant. Existing points above the cap are kept.
  max-points: 50
  # Recovery uses elapsed wall-clock time, including time away, and pauses at the cap.
  recovery:
    interval-seconds: 3600
    points-per-interval: 10

quote:
  max-move-distance: 8.0
  expire-seconds: 30
  cancel-on-target-move: true
  target-max-move-distance: 64.0
request:
  expire-seconds: 30
  cancel-on-target-move: true
  target-max-move-distance: 64.0
cross-world:
  enable: true

# This section controls warmup times only. Set prices in each command's pricing section.
worlds:
  default:
    base_time: 3.0
    distance_time_1k: 1.0
  "minecraft:resources":
    base_time: 3.0
    distance_time_1k: 1.0
  "minecraft:the_nether":
    base_time: 5.0
    distance_time_1k: 1.5
  "minecraft:the_end":
    base_time: 5.0
    distance_time_1k: 2.0

# Worlds not listed here use default. Missing fields in individual world entries also use default.
# allow-enter controls entry from another world, independently of pricing mode or fee bypass permissions.
# enter/leave fees apply only to distance mode with include-world-transfer-fees: true.
# free always costs 0. fixed charges only fixed-price, without additional world transfer fees.
world-transfers:
  default:
    allow-enter: true
    enter: 100.0
    leave: 50.0
  "minecraft:resources":
    enter: 50.0
    leave: 0.0
  "minecraft:the_nether":
    enter: 100.0
    leave: 200.0
  "minecraft:the_end":
    allow-enter: false
    enter: 0.0
    leave: 500.0
